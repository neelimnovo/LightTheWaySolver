plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

dependencies {
    implementation 'org.openjfx:javafx-controls:25'
    implementation 'org.openjfx:javafx-fxml:25'
    implementation 'org.openjfx:javafx-graphics:25'
    implementation 'org.openjfx:javafx-base:25'
    implementation 'com.google.code.gson:gson:2.13.2'

}

// Compile C++ solver
task compileCpp(type: Exec) {
    workingDir 'src/cpp/solver'
    commandLine 'g++', '-O3', '-std=c++17', '-w', '-o', 'solver',
                  'main.cpp', 'Grid.cpp', 'Solver.cpp'
}

// Run C++ solver test
task runCppSolver(type: Exec, dependsOn: 'compileCpp') {
    workingDir 'src/cpp/solver'
    commandLine './solver'
}

// Clean C++ build
task cleanCpp(type: Delete) {
    delete 'src/cpp/solver/solver'
}

javafx {
    version = "25" // Specify the JavaFX version you want to use
    modules = [ 'javafx.controls', 'javafx.fxml' ] // Add required JavaFX modules
}

application {
    // The main class for the JavaFX application
    mainClass = 'ui.MainMenu'
}

// Generate debugging information for Visual Studio Code
tasks.withType(JavaCompile) {
    options.debug = true
    options.compilerArgs << '-g'
}

// Run the headless level solver test via CLI
// Usage: gradle runTest -PlevelName="Level 015.json"
// Add -Pprofile to print hot-path counters/timings for the solve
// Add -Pdedupe as well to also count distinct physical light outcomes (slower, more memory)
task runTest(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tests.levelTest'
    args = project.hasProperty('levelName') ? [project.property('levelName')] : []
    if (project.hasProperty('profile')) systemProperty 'solver.profile', 'true'
    if (project.hasProperty('dedupe')) systemProperty 'solver.profile.dedupe', 'true'
    // -Pnofilter bypasses all placement heuristics: ground truth for solvability
    if (project.hasProperty('nofilter')) systemProperty 'solver.nofilter', 'true'
}

// Run the headless level solver test using the C++ solver
// Usage: gradle runTestCpp -PlevelName="Level 015.json"
task runTestCpp(type: JavaExec, dependsOn: 'compileCpp') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tests.levelTestCpp'
    args = project.hasProperty('levelName') ? [project.property('levelName')] : []
}

task debugRun(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tests.DebugRun'
}

